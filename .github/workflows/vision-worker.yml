name: Vision worker rules
on:
  pull_request:
    paths:
      - 'services/vision-worker/**'
      - '.github/workflows/vision-worker.yml'
  push:
    paths:
      - 'services/vision-worker/**'
      - '.github/workflows/vision-worker.yml'
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/vision-worker/tests -v
      - run: python -m py_compile services/vision-worker/motion_core.py services/vision-worker/moltivate_motion.py
      - run: bash -n services/vision-worker/bootstrap.sh
