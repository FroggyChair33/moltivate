name: Workout preparation timer
on:
  push:
    paths: ['packages/workout-prep/**', '.github/workflows/workout-prep.yml']
  pull_request:
    paths: ['packages/workout-prep/**', '.github/workflows/workout-prep.yml']
permissions:
  contents: read
jobs:
  countdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: node --test packages/workout-prep/tests/*.test.mjs
